server.port=8083
spring.application.name=product-service

spring.datasource.url=jdbc:mysql://localhost:3306/productservice?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=MySQL@100
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ORM: development configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Product Service
info.app.version=1.0.0

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Kafka: optional during local development
spring.kafka.bootstrap-servers=localhost:9092
app.kafka.enabled=false
app.kafka.topic=product-events

logging.level.com.microservice.productservice=INFO
logging.level.org.apache.camel=INFO